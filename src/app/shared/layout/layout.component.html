<div class="flex h-screen w-screen overflow-hidden box-border">
  <button 
    class="md:hidden fixed top-4 left-4 z-50 bg-sky-950 text-white p-2 rounded-lg"
    (click)="sidebarService.toggleMenu()">
    <mat-icon>menu</mat-icon>
  </button>
  <app-sidenav class="fixed ml-5 z-50 top-0"></app-sidenav>

  <div class="flex-grow mt-16 h-[calc(100vh-3.5rem)] md:ml-[250px]  md:mt-5 flex flex-col md:h-screen min-w-[300px] overflow-y-auto">
    <!-- Header + Título (que se desplaza con el scroll) -->
    <div class="flex w-full">
      <h1 class="text-3xl font-bold text-gray-800 mr-auto ml-10">{{ pageTitle }}</h1>
      <app-header class="flex items-center justify-end mr-5 flex-grow w-full"></app-header>
    </div>
    
    <div class="flex-grow p-5 min-w-[300px] w-full relative">
      <div *ngIf="loading" class="loading-overlay" role="status" aria-live="polite">
        <div class="loading-card">
          <div class="loading-mark" aria-hidden="true">
            <span class="loading-orbit"></span>
            <span class="loading-orbit loading-orbit-inner"></span>
            <span class="loading-core">L</span>
            <span class="loading-spark"></span>
          </div>
          <div class="loading-copy">
            <span class="loading-title">Cargando tu espacio</span>
            <span class="loading-caption">Estamos preparando todo para ti</span>
          </div>
        </div>
      </div>

      <!-- Mostrar el contenido solo cuando el spinner no esté visible -->
      <div *ngIf="!loading">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>
